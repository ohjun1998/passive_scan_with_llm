name: Bounty assistant local tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bounty_assist global_mixer.py txt_to_excel.py
