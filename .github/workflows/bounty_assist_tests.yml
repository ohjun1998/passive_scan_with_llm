name: Bounty assistant local tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bounty_assist global_mixer.py txt_to_excel.py
      - name: Parse Windows launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows_start.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
